<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17365D; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526579; }
      .section { font: 700 18px Arial, sans-serif; fill: #FFFFFF; }
      .label { font: 700 16px Arial, sans-serif; fill: #17365D; }
      .body { font: 15px Arial, sans-serif; fill: #26384A; }
      .small { font: 13px Arial, sans-serif; fill: #526579; }
      .pin { font: 700 14px Consolas, monospace; fill: #26384A; }
      .warning { font: 700 15px Arial, sans-serif; fill: #8A3B12; }
      .box { fill: #FFFFFF; stroke: #B7C7D8; stroke-width: 2; }
      .dash { fill: #FAFCFF; stroke: #8BA7C3; stroke-width: 2; stroke-dasharray: 8 7; }
      .wire-analog { fill: none; stroke: #2B9A66; stroke-width: 4; }
      .wire-power { fill: none; stroke: #D94747; stroke-width: 4; }
      .wire-ground { fill: none; stroke: #202A35; stroke-width: 4; }
      .wire-pwm { fill: none; stroke: #E88922; stroke-width: 4; }
      .wire-sonar { fill: none; stroke: #7556B3; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17365D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#F6F9FC"/>
  <text x="800" y="52" text-anchor="middle" class="title">TinyML Inflow Forecaster — Wiring Diagram</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">ESP32 edge controller · field sensors · ultrasonic basin level · two gate servos</text>

  <!-- ESP32 controller -->
  <g filter="url(#shadow)">
    <rect x="610" y="170" width="380" height="570" rx="22" fill="#EAF6EF" stroke="#4F9B6B" stroke-width="3"/>
  </g>
  <rect x="610" y="170" width="380" height="70" rx="22" fill="#2D7D46"/>
  <rect x="610" y="215" width="380" height="25" fill="#2D7D46"/>
  <text x="800" y="213" text-anchor="middle" class="section">ESP32 DEVKIT V1</text>
  <text x="800" y="270" text-anchor="middle" class="label">Local control + INT8 TFLM inference</text>
  <text x="800" y="294" text-anchor="middle" class="small">PlatformIO / Arduino / ESP32Servo</text>

  <!-- ESP32 pin groups -->
  <rect x="635" y="325" width="330" height="142" rx="12" fill="#FFFFFF" stroke="#B7D6C1"/>
  <text x="655" y="352" class="label">Field sensor inputs</text>
  <text x="655" y="380" class="pin">D34 / GPIO34  ← Rainfall</text>
  <text x="655" y="415" class="pin">D32 / GPIO32  ← Discharge</text>
  <text x="655" y="450" class="pin">D33 / GPIO33  ← Soil saturation</text>

  <rect x="635" y="488" width="330" height="105" rx="12" fill="#FFFFFF" stroke="#B7D6C1"/>
  <text x="655" y="515" class="label">Basin level sensor</text>
  <text x="655" y="543" class="pin">D27 / GPIO27  → TRIG</text>
  <text x="655" y="568" class="pin">D14 / GPIO14  ← ECHO</text>
  <text x="655" y="585" class="small">field build: USE_ULTRASONIC</text>

  <rect x="635" y="614" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#B7D6C1"/>
  <text x="655" y="641" class="label">Gate actuator outputs</text>
  <text x="655" y="669" class="pin">D25 / GPIO25  → Servo A PWM</text>
  <text x="655" y="694" class="pin">D26 / GPIO26  → Servo B PWM</text>

  <!-- Analog sensors -->
  <g filter="url(#shadow)">
    <rect x="65" y="150" width="410" height="380" rx="18" class="box"/>
  </g>
  <rect x="65" y="150" width="410" height="54" rx="18" fill="#2B9A66"/>
  <rect x="65" y="180" width="410" height="24" fill="#2B9A66"/>
  <text x="270" y="185" text-anchor="middle" class="section">FIELD SENSORS</text>
  <text x="270" y="232" text-anchor="middle" class="small">Conditioned 0–3.3 V outputs to ESP32 ADC inputs</text>

  <!-- Field sensor symbols -->
  <g fill="#DCEFE5" stroke="#2B9A66" stroke-width="2">
    <rect x="100" y="252" width="100" height="64" rx="8"/>
    <rect x="100" y="382" width="100" height="64" rx="8"/>
    <rect x="100" y="447" width="100" height="64" rx="8"/>
  </g>
  <!-- Analogue rain gauge transmitter -->
  <path d="M125 264 H175 L165 282 H135 Z M145 282 V300 M135 300 H165" fill="#FFFFFF"/>
  <!-- Flow sensor / turbine -->
  <circle cx="150" cy="414" r="22" fill="#FFFFFF"/>
  <path d="M150 392 V436 M128 414 H172 M136 400 L164 428 M164 400 L136 428" fill="none"/>
  <!-- Capacitive soil probe -->
  <path d="M130 461 H170 V490 H130 Z M137 490 V505 M163 490 V505" fill="#FFFFFF"/>
  <g stroke="#2B9A66" stroke-width="3">
    <line x1="200" y1="284" x2="445" y2="284"/>
    <line x1="200" y1="414" x2="445" y2="414"/>
    <line x1="200" y1="479" x2="445" y2="479"/>
  </g>
  <text x="215" y="278" class="label">Rain gauge</text><text x="215" y="298" class="pin">0–3.3 V → GPIO34</text>
  <text x="215" y="408" class="label">Flow sensor</text><text x="215" y="428" class="pin">0–3.3 V → GPIO32</text>
  <text x="215" y="473" class="label">Capacitive soil probe</text><text x="215" y="493" class="pin">0–3.3 V → GPIO33</text>

  <!-- Analog wires -->
  <path d="M445 284 C510 284 540 365 610 365" class="wire-analog"/>
  <path d="M445 414 C510 414 540 415 610 415" class="wire-analog"/>
  <path d="M445 479 C510 479 540 440 610 440" class="wire-analog"/>
  <text x="497" y="278" class="small" fill="#2B9A66">green SIG</text>
  <text x="498" y="501" class="small" fill="#2B9A66">green SIG</text>

  <!-- Shared sensor power -->
  <path d="M250 530 L250 555 L560 555 L560 305 L610 305" class="wire-power"/>
  <path d="M290 530 L290 570 L530 570 L530 735 L610 735" class="wire-ground"/>
  <text x="260" y="550" class="small">3V3</text>
  <text x="300" y="588" class="small">GND</text>
  <text x="315" y="610" class="small">shared sensor rails</text>

  <!-- Ultrasonic -->
  <g filter="url(#shadow)">
    <rect x="1050" y="150" width="455" height="235" rx="18" class="box"/>
  </g>
  <rect x="1050" y="150" width="455" height="54" rx="18" fill="#7556B3"/>
  <rect x="1050" y="180" width="455" height="24" fill="#7556B3"/>
  <text x="1277" y="185" text-anchor="middle" class="section">BASIN LEVEL SENSOR</text>
  <text x="1277" y="232" text-anchor="middle" class="small">Primary measurement · ultrasonic distance</text>
  <rect x="1160" y="255" width="240" height="110" rx="12" fill="#F4F0FB" stroke="#7556B3" stroke-width="3"/>
  <circle cx="1225" cy="310" r="32" fill="#D9CFF0" stroke="#7556B3" stroke-width="3"/>
  <circle cx="1335" cy="310" r="32" fill="#D9CFF0" stroke="#7556B3" stroke-width="3"/>
  <path d="M1190 310 H1160 M1400 280 H1435 M1400 340 H1435" class="wire-sonar"/>
  <text x="1278" y="385" text-anchor="middle" class="label">HC-SR04</text>
  <text x="1110" y="290" class="pin">TRIG → GPIO27</text>
  <text x="1110" y="350" class="pin">ECHO ← GPIO14</text>
  <path d="M1090 284 H1160" class="wire-sonar"/>
  <path d="M1090 345 H1160" class="wire-sonar"/>
  <path d="M1090 284 C1045 284 1030 535 990 535" class="wire-sonar"/>
  <path d="M1090 345 C1035 345 1020 560 990 560" class="wire-sonar"/>
  <text x="1010" y="507" class="small" fill="#7556B3">purple signal</text>
  <text x="1090" y="382" class="small">Use a 3.3 V-compatible module or level-shift ECHO.</text>

  <!-- Servos -->
  <g filter="url(#shadow)">
    <rect x="1050" y="440" width="455" height="300" rx="18" class="box"/>
  </g>
  <rect x="1050" y="440" width="455" height="54" rx="18" fill="#D15B5B"/>
  <rect x="1050" y="470" width="455" height="24" fill="#D15B5B"/>
  <text x="1277" y="475" text-anchor="middle" class="section">TWO GATE SERVOS</text>
  <!-- Servo motor symbols -->
  <g fill="#FFF2F2" stroke="#D15B5B" stroke-width="3">
    <rect x="1160" y="520" width="180" height="76" rx="10"/>
    <rect x="1160" y="610" width="180" height="76" rx="10"/>
    <circle cx="1265" cy="558" r="24" fill="#FFD4D4"/>
    <circle cx="1265" cy="648" r="24" fill="#FFD4D4"/>
  </g>
  <g stroke="#D15B5B" stroke-width="3">
    <line x1="1090" y1="558" x2="1160" y2="558"/><line x1="1090" y1="648" x2="1160" y2="648"/>
    <line x1="1265" y1="558" x2="1300" y2="535"/><line x1="1265" y1="648" x2="1300" y2="625"/>
    <line x1="1340" y1="540" x2="1390" y2="540"/><line x1="1340" y1="558" x2="1390" y2="558"/><line x1="1340" y1="576" x2="1390" y2="576"/>
    <line x1="1340" y1="630" x2="1390" y2="630"/><line x1="1340" y1="648" x2="1390" y2="648"/><line x1="1340" y1="666" x2="1390" y2="666"/>
  </g>
  <text x="1180" y="545" class="label">Servo A</text><text x="1180" y="575" class="pin">PWM → GPIO25</text>
  <text x="1180" y="635" class="label">Servo B</text><text x="1180" y="665" class="pin">PWM → GPIO26</text>
  <path d="M1090 558 C1040 558 1025 669 990 669" class="wire-pwm"/>
  <path d="M1090 648 C1040 648 1025 694 990 694" class="wire-pwm"/>
  <text x="1008" y="640" class="small" fill="#E88922">PWM</text>

  <!-- External supply and shared ground -->
  <g filter="url(#shadow)">
    <rect x="1050" y="780" width="455" height="125" rx="18" fill="#FFF8E8" stroke="#DDB56A" stroke-width="2"/>
  </g>
  <g stroke="#B77A16" stroke-width="3" fill="#FFE9A8">
    <rect x="1080" y="815" width="72" height="52" rx="5"/>
    <line x1="1152" y1="832" x2="1163" y2="832"/><line x1="1152" y1="850" x2="1163" y2="850"/>
    <rect x="1190" y="810" width="110" height="62" rx="7"/>
  </g>
  <text x="1100" y="808" class="small">5–6 V battery</text>
  <text x="1245" y="845" text-anchor="middle" class="label">REGULATOR</text>
  <text x="1325" y="812" class="label">SERVO POWER</text>
  <text x="1325" y="839" class="body">red V+ → both servos</text>
  <text x="1325" y="864" class="body">GND → ESP32 + servos</text>
  <text x="1325" y="889" class="small">470–1000 µF capacitor</text>
  <path d="M1160 780 L1160 720 L1140 720 L1140 681" class="wire-power"/>
  <path d="M1395 780 L1395 750 L980 750 L980 735 L965 735" class="wire-ground"/>
  <text x="1168" y="755" class="small" fill="#D94747">red V+</text>
  <text x="1220" y="744" class="small">common ground</text>

  <!-- Warning -->
  <rect x="65" y="790" width="900" height="115" rx="16" fill="#FFF0E8" stroke="#E0A37B" stroke-width="2"/>
  <text x="90" y="823" class="warning">SAFETY / POWER NOTE</text>
  <text x="90" y="850" class="body">Do not connect servo positive wires to ESP32 3V3. Power servos from a separate</text>
  <text x="90" y="873" class="body">regulated 5–6 V supply sized for combined stall current; connect grounds together.</text>

  <!-- Legend -->
  <text x="65" y="955" class="label">Wire legend</text>
  <line x1="180" y1="950" x2="225" y2="950" class="wire-analog"/><text x="235" y="955" class="small">analogue SIG</text>
  <line x1="350" y1="950" x2="395" y2="950" class="wire-power"/><text x="405" y="955" class="small">power</text>
  <line x1="485" y1="950" x2="530" y2="950" class="wire-ground"/><text x="540" y="955" class="small">ground</text>
  <line x1="625" y1="950" x2="670" y2="950" class="wire-pwm"/><text x="680" y="955" class="small">servo PWM</text>
  <line x1="790" y1="950" x2="835" y2="950" class="wire-sonar"/><text x="845" y="955" class="small">ultrasonic</text>
</svg>
